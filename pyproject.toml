[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeploop-cli"
version = "0.1.0"
description = "Budget-first autonomous agent harness: loops cheap models until verifiable success criteria pass"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "DeepLoop contributors" }]
keywords = ["agent", "llm", "deepseek", "autonomous", "harness", "budget"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "textual>=1.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
deeploop = "deeploop.cli:main"

[project.urls]
Homepage = "https://github.com/coffeequantz/deeploop"
Repository = "https://github.com/coffeequantz/deeploop"
Issues = "https://github.com/coffeequantz/deeploop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deeploop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
